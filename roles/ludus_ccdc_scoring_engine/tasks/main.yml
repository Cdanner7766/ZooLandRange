---
# The Ludus router's DNS (10.X.10.254) rejects queries from range VMs because
# the default always_blocked_networks rule covers 10.0.0.0/8, so apt and other
# downloads hang. Use public resolvers instead (internet traffic is NATed).
- name: "Use public DNS resolvers (router DNS is unreachable from the range)"
  ansible.builtin.shell: |
    set -e
    # Ludus writes the router as DNS in /etc/network/interfaces and
    # /etc/systemd/resolved.conf and re-applies it; replace it at the source.
    if [ -f /etc/network/interfaces ]; then
      sed -i 's/^\([[:space:]]*dns-nameservers\).*/\1 1.1.1.1 8.8.8.8/' /etc/network/interfaces
    fi
    if systemctl is-active --quiet systemd-resolved; then
      sed -i 's/^DNS=.*/DNS=1.1.1.1 8.8.8.8/' /etc/systemd/resolved.conf
      mkdir -p /etc/systemd/resolved.conf.d
      printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' > /etc/systemd/resolved.conf.d/zooland-dns.conf
      systemctl restart systemd-resolved
      resolvectl dns "$(ip route show default | awk '{print $5; exit}')" 1.1.1.1 8.8.8.8
    else
      grep -q '^supersede domain-name-servers' /etc/dhcp/dhclient.conf 2>/dev/null || \
        echo 'supersede domain-name-servers 1.1.1.1, 8.8.8.8;' >> /etc/dhcp/dhclient.conf
      printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
    fi
  args:
    executable: /bin/bash
  become: true
  changed_when: true

# tasks file for ludus_ccdc_scoring_engine
# Deploys the CCDC Blue Team Scoring Engine to SCORESVR as a systemd service.
# Source files are bundled in roles/ludus_ccdc_scoring_engine/files/ so that
# Ludus can find them after installing the role to its Ansible roles path.

- name: "Install system dependencies"
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
  become: true

- name: "Install Firefox for dashboard display"
  ansible.builtin.apt:
    name: firefox
    state: present
  become: true

- name: "Create scoring engine system user"
  ansible.builtin.user:
    name: "{{ scoring_engine_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ scoring_engine_dir }}"
    create_home: false
  become: true

- name: "Create scoring engine directory"
  ansible.builtin.file:
    path: "{{ scoring_engine_dir }}"
    state: directory
    owner: "{{ scoring_engine_user }}"
    group: "{{ scoring_engine_user }}"
    mode: "0755"
  become: true

- name: "Create templates subdirectory"
  ansible.builtin.file:
    path: "{{ scoring_engine_dir }}/templates"
    state: directory
    owner: "{{ scoring_engine_user }}"
    group: "{{ scoring_engine_user }}"
    mode: "0755"
  become: true

- name: "Remove stale scoring database so credentials and history reset on each deploy"
  ansible.builtin.file:
    path: "{{ scoring_engine_dir }}/scores.db"
    state: absent
  become: true

- name: "Copy scoring engine Python source files"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ scoring_engine_dir }}/{{ item }}"
    owner: "{{ scoring_engine_user }}"
    group: "{{ scoring_engine_user }}"
    mode: "0644"
  loop:
    - app.py
    - checks.py
    - config.py
    - database.py
    - requirements.txt
  become: true
  notify: Restart scoring engine

- name: "Copy HTML dashboard template"
  ansible.builtin.copy:
    src: "templates/index.html"
    dest: "{{ scoring_engine_dir }}/templates/index.html"
    owner: "{{ scoring_engine_user }}"
    group: "{{ scoring_engine_user }}"
    mode: "0644"
  become: true
  notify: Restart scoring engine

- name: "Create Python virtual environment"
  ansible.builtin.command:
    cmd: python3 -m venv "{{ scoring_engine_dir }}/venv"
    creates: "{{ scoring_engine_dir }}/venv/bin/activate"
  become: true

- name: "Install Python dependencies into virtual environment"
  ansible.builtin.pip:
    requirements: "{{ scoring_engine_dir }}/requirements.txt"
    virtualenv: "{{ scoring_engine_dir }}/venv"
  become: true

- name: "Set ownership of virtual environment"
  ansible.builtin.file:
    path: "{{ scoring_engine_dir }}/venv"
    owner: "{{ scoring_engine_user }}"
    group: "{{ scoring_engine_user }}"
    recurse: true
  become: true

- name: "Deploy systemd service unit"
  ansible.builtin.template:
    src: scoring_engine.service.j2
    dest: /etc/systemd/system/scoring_engine.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart scoring engine

- name: "Enable and start scoring engine service"
  ansible.builtin.systemd:
    name: scoring_engine
    enabled: true
    state: started
    daemon_reload: true
  become: true
