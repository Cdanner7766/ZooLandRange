---
# All tasks delegate to localhost (the Proxmox host). Uses pveum/pvesh CLI — no
# API credentials required when running as root on the Proxmox node.

# A non-admin Ludus user has no Proxmox privileges, so every pveum call fails with
# "Unable to load access control list". Probe first and skip the role with a warning
# instead of failing the whole deploy; an admin must then apply the steps (or deploy).
- name: "Probe for Proxmox admin rights"
  ansible.builtin.command: pveum user list
  delegate_to: localhost
  run_once: true
  register: pve_probe
  changed_when: false
  failed_when: false

- name: "Skip blue team Proxmox access (insufficient Proxmox privileges)"
  ansible.builtin.debug:
    msg:
      - "WARNING: skipped - this deploy has no Proxmox admin rights, so {{ blueteam_proxmox_user }} was not configured."
      - "An admin must run, on the Proxmox host (VM IDs from 'qm list'):"
      - "  pveum user add {{ blueteam_proxmox_user }} --password '{{ blueteam_proxmox_password }}'"
      - "  for id in <VM IDs of the 7 blue team VMs>; do pveum acl modify /vms/$id --users {{ blueteam_proxmox_user }} --roles PVEVMUser; done"
      - "Or re-run this role as an admin: ludus range deploy -t user-defined-roles"
  run_once: true
  when: pve_probe.rc != 0

- name: "Configure blue team Proxmox access"
  when: pve_probe.rc == 0
  block:
    - name: "Create {{ blueteam_proxmox_user }} Proxmox user"
      ansible.builtin.command: >-
        pveum user add {{ blueteam_proxmox_user }}
        --password {{ blueteam_proxmox_password | quote }}
        --comment "Blue team Proxmox console access"
      delegate_to: localhost
      run_once: true
      register: user_create
      failed_when: user_create.rc != 0 and 'already exists' not in (user_create.stderr + user_create.stdout)
      changed_when: user_create.rc == 0
      no_log: true

    - name: "Query all VMs in cluster"
      ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
      delegate_to: localhost
      run_once: true
      register: cluster_vms
      changed_when: false

    - name: "Resolve blue team VM IDs from cluster resources"
      ansible.builtin.set_fact:
        blueteam_vmids: >-
          {{
            (cluster_vms.stdout | from_json)
            | selectattr('name', 'in', blueteam_vm_names)
            | map(attribute='vmid')
            | list
          }}
      delegate_to: localhost
      run_once: true

    # VMs already belong to the Ludus per-user pool (a VM can only be in one pool, and
    # moving them would break the Ludus user's access), so grant access per VM instead.
    - name: "Grant PVEVMUser to {{ blueteam_proxmox_user }} on each blue team VM"
      ansible.builtin.command: >-
        pveum acl modify /vms/{{ item }}
        --users {{ blueteam_proxmox_user }}
        --roles PVEVMUser
      delegate_to: localhost
      run_once: true
      loop: "{{ blueteam_vmids }}"
      register: acl_grant
      changed_when: acl_grant.rc == 0
