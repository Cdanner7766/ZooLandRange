---
# defaults file for ludus_ccdc_blueteam_access

# Proxmox user to create (PVE realm — credentials stored in Proxmox, not Linux PAM)
blueteam_proxmox_user: "BlueTeam@pve"
blueteam_proxmox_password: "BlueTeam"

# Proxmox pool name for all blue team VMs
blueteam_pool_name: "ZooLand-BlueTeam"

# VMs to add to the pool. Excludes JAGUAR (red team) and SCORESVR (admin infra).
# range_id is set automatically by Ludus for each deployment.
blueteam_vm_names:
  - "{{ range_id }}-GIRAFFE"
  - "{{ range_id }}-MEERKAT"
  - "{{ range_id }}-ZEBRA"
  - "{{ range_id }}-PENGUIN"
  - "{{ range_id }}-OTTER"
  - "{{ range_id }}-FLAMINGO"
  - "{{ range_id }}-HIPPO"
