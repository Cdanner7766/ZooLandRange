---
# tasks file for ludus_ccdc_workstation
# Installs blue team tools via Chocolatey on the Win11 workstation.
# Replaces install_additional_tools: true to avoid the vscode Chocolatey
# package, which consistently fails to download from update.code.visualstudio.com
# in automated environments (Microsoft rate-limits/blocks the CDN endpoint).

- name: "Set local Administrator password on MEERKAT"
  ansible.windows.win_powershell:
    script: |
      net user Administrator ZooTime!
      Write-Output "Administrator password updated"

- name: "Grant Domain Users RDP access on MEERKAT"
  ansible.windows.win_powershell:
    script: |
      # The scoring engine rotates its RDP login through jsmith, bwilson, mchen, mlopez, rthomas.
      # Domain Users group covers all employees; local check uses jsmith specifically.
      Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ZOOLAND\Domain Users" -ErrorAction SilentlyContinue
      Write-Output "Domain Users added to Remote Desktop Users"

- name: "Wait for internet DNS resolution on MEERKAT"
  ansible.windows.win_powershell:
    script: |
      # MEERKAT resolves names through GIRAFFE (the DC). Wait for GIRAFFE to
      # forward public lookups before Chocolatey tries to download anything.
      $name = "community.chocolatey.org"
      $ok = $false
      for ($i = 1; $i -le 12 -and -not $ok; $i++) {
        try {
          Clear-DnsClientCache
          Resolve-DnsName $name -Type A -DnsOnly -ErrorAction Stop | Out-Null
          $ok = $true
        } catch {
          Write-Output "Attempt $i/12: cannot resolve $name, retrying in 10s"
          Start-Sleep -Seconds 10
        }
      }

      if (-not $ok) {
        # Safety net: keep the DC as primary DNS (needed for AD) and add a public
        # resolver as secondary so internet lookups still work.
        Write-Output "DC DNS did not resolve $name; adding 1.1.1.1 as secondary DNS"
        $nic = Get-NetAdapter | Where-Object Status -eq "Up" | Select-Object -First 1
        $current = (Get-DnsClientServerAddress -InterfaceIndex $nic.ifIndex -AddressFamily IPv4).ServerAddresses
        $servers = @($current) + "1.1.1.1" | Select-Object -Unique
        Set-DnsClientServerAddress -InterfaceIndex $nic.ifIndex -ServerAddresses $servers
        Clear-DnsClientCache
        Resolve-DnsName $name -Type A -DnsOnly -ErrorAction Stop | Out-Null
      }
      Write-Output "$name resolves"

- name: "Bootstrap Chocolatey"
  ansible.windows.win_shell: |
    if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
      [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
      Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
    }
    $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('PATH','User')
  args:
    executable: powershell

- name: "Set solid dark blue desktop background on MEERKAT"
  ansible.windows.win_powershell:
    script: |
      reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" 2>$null

      $profiles = @("Registry::HKEY_USERS\DefaultUser", "HKCU:")
      foreach ($hive in $profiles) {
        $desktopKey = "$hive\Control Panel\Desktop"
        $colorsKey  = "$hive\Control Panel\Colors"

        Set-ItemProperty -Path $desktopKey -Name "Wallpaper"      -Value "" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $desktopKey -Name "WallpaperStyle" -Value "0" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $desktopKey -Name "TileWallpaper"  -Value "0" -ErrorAction SilentlyContinue

        if (-not (Test-Path $colorsKey)) { New-Item -Path $colorsKey -Force | Out-Null }
        Set-ItemProperty -Path $colorsKey -Name "Background" -Value "0 0 128" -ErrorAction SilentlyContinue
      }

      reg unload "HKU\DefaultUser" 2>$null

      try {
        Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class WP { [DllImport("user32.dll")] public static extern bool SystemParametersInfo(int a, int b, string c, int d); }'
      } catch {}
      [WP]::SystemParametersInfo(20, 0, "", 3) | Out-Null

- name: "Install blue team tools via Chocolatey"
  chocolatey.chocolatey.win_chocolatey:
    name:
      - networkmonitor
      - processhacker
      - 7zip
      - croc
      - firefox
      - burp-suite-free-edition
      - ilspy
      - explorersuite
      - wireshark
    state: present
    timeout: 2700
