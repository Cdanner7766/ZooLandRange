---
# The Ludus router's DNS (10.X.10.254) rejects queries from range VMs because
# the default always_blocked_networks rule covers 10.0.0.0/8, so apt and other
# downloads hang. Use public resolvers instead (internet traffic is NATed).
- name: "Use public DNS resolvers (router DNS is unreachable from the range)"
  ansible.builtin.shell: |
    set -e
    if systemctl is-active --quiet systemd-resolved; then
      mkdir -p /etc/systemd/resolved.conf.d
      printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' > /etc/systemd/resolved.conf.d/zooland-dns.conf
      resolvectl dns "$(ip route show default | awk '{print $5; exit}')" 1.1.1.1 8.8.8.8
    else
      grep -q '^supersede domain-name-servers' /etc/dhcp/dhclient.conf 2>/dev/null || \
        echo 'supersede domain-name-servers 1.1.1.1, 8.8.8.8;' >> /etc/dhcp/dhclient.conf
      printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
    fi
  args:
    executable: /bin/bash
  become: true
  changed_when: true

# tasks file for ludus_ccdc_kali_setup
# Installs CCDC-relevant attack tools on the Kali attacker VM (JAGUAR).
#
# We intentionally do NOT install kali-linux-default because:
#   - It pulls ~2.4 GB including packages hosted on Cloudflare CDN (kali.download)
#     that are frequently unreachable (dbd, hyperion, windows-binaries, python3-masky)
#   - It includes hundreds of tools irrelevant to CCDC (forensics, hardware, radio)
#   - The dependency chain fails the entire install when even one package is unfetchable
#
# Instead we install a targeted list of tools used in CCDC red/blue team operations.

- name: Set Kali sources.list to archive mirror (avoids Cloudflare CDN)
  ansible.builtin.copy:
    content: |
      deb http://archive-4.kali.org/kali kali-rolling main contrib non-free non-free-firmware
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Full upgrade all packages
  ansible.builtin.apt:
    upgrade: full
  become: true

- name: Install CCDC red-team tools
  ansible.builtin.apt:
    name:
      # --- Reconnaissance ---
      - nmap
      - masscan
      - netdiscover
      - nbtscan
      - enum4linux
      - ldap-utils
      # --- Web ---
      - nikto
      - sqlmap
      - gobuster
      - dirb
      - curl
      - wget
      # --- Exploitation ---
      - metasploit-framework
      - exploitdb
      - beef-xss
      # --- Password / credential attacks ---
      - hydra
      - john
      - hashcat
      - crunch
      - wordlists
      # --- Active Directory / Windows ---
      - impacket-scripts
      - bloodhound
      - evil-winrm
      - responder
      - crackmapexec
      - netexec
      # --- SMB / file access ---
      - smbclient
      - smbmap
      # --- Network / packet capture ---
      - wireshark
      - tcpdump
      - ettercap-text-only
      - dsniff
      # --- Post-exploitation ---
      - powershell-empire
      - starkiller
      # --- Utilities ---
      - net-tools
      - dnsutils
      - whois
      - python3-pip
      - python3-impacket
      - git
      - vim
      - tmux
    state: present
    install_recommends: false
  become: true
  ignore_errors: true  # Individual package failures won't abort — most tools will still install
