---
# The Ludus router's DNS (10.X.10.254) rejects queries from range VMs because
# the default always_blocked_networks rule covers 10.0.0.0/8, so apt and other
# downloads hang. Use public resolvers instead (internet traffic is NATed).
- name: "Use public DNS resolvers (router DNS is unreachable from the range)"
  ansible.builtin.shell: |
    set -e
    # Ludus writes the router as DNS in /etc/network/interfaces and
    # /etc/systemd/resolved.conf and re-applies it; replace it at the source.
    if [ -f /etc/network/interfaces ]; then
      sed -i 's/^\([[:space:]]*dns-nameservers\).*/\1 1.1.1.1 8.8.8.8/' /etc/network/interfaces
    fi
    if systemctl is-active --quiet systemd-resolved; then
      sed -i 's/^DNS=.*/DNS=1.1.1.1 8.8.8.8/' /etc/systemd/resolved.conf
      mkdir -p /etc/systemd/resolved.conf.d
      printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' > /etc/systemd/resolved.conf.d/zooland-dns.conf
      systemctl restart systemd-resolved
      resolvectl dns "$(ip route show default | awk '{print $5; exit}')" 1.1.1.1 8.8.8.8
    else
      grep -q '^supersede domain-name-servers' /etc/dhcp/dhclient.conf 2>/dev/null || \
        echo 'supersede domain-name-servers 1.1.1.1, 8.8.8.8;' >> /etc/dhcp/dhclient.conf
      printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
    fi
  args:
    executable: /bin/bash
  become: true
  changed_when: true

# tasks file for ludus_ccdc_ftp_server
# Configures vsftpd FTP server with intentional CCDC vulnerabilities

# Install vsftpd (do NOT run apt upgrade - keep outdated packages)
- name: "Install vsftpd"
  ansible.builtin.apt:
    name:
      - vsftpd
      - ftp
    state: present
    update_cache: true
  become: true

# VULN: Configure vsftpd with anonymous access and no TLS
- name: "VULN - Configure insecure vsftpd"
  ansible.builtin.copy:
    dest: /etc/vsftpd.conf
    content: |
      # INSECURE vsftpd configuration
      # Secure option (DISABLED): anonymous_enable=NO
      # Secure option (DISABLED): ssl_enable=YES
      # Secure option (DISABLED): chroot_local_user=YES
      # Secure option (DISABLED): allow_writeable_chroot=NO

      listen=YES
      listen_ipv6=NO

      # VULN: Anonymous access enabled
      anonymous_enable=YES
      anon_upload_enable=YES
      anon_mkdir_write_enable=YES
      anon_other_write_enable=YES
      anon_root=/srv/ftp

      # Local user access
      local_enable=YES
      write_enable=YES

      # VULN: No chroot - users can traverse entire filesystem
      chroot_local_user=NO

      # VULN: No TLS - credentials sent in cleartext
      ssl_enable=NO

      # VULN: Writable root
      anon_umask=000
      local_umask=000
      file_open_mode=0777

      # Required: vsftpd refuses to chroot into a world-writable directory
      # unless this option is set. Without it, every anonymous login returns
      # "500 OOPS: refusing to run with writable root inside chroot()" and
      # the session is dropped. This must be YES to keep anonymous FTP alive.
      allow_writeable_chroot=YES

      # VULN: Verbose banner with version info
      ftpd_banner=Welcome to CCDC Practice FTP Server (vsftpd 3.0.5)

      # PAM service
      pam_service_name=vsftpd

      # Logging
      xferlog_enable=YES
      connect_from_port_20=YES

      # VULN: Allow FTP bounce attacks
      # Secure option (DISABLED): pasv_promiscuous=NO
      pasv_promiscuous=YES
      port_promiscuous=YES

      # Passive mode ports
      pasv_min_port=40000
      pasv_max_port=40100
    owner: root
    group: root
    mode: "0644"
  become: true

# Create FTP directories and set insecure permissions
- name: "Create FTP directories with insecure permissions"
  ansible.builtin.shell: |
    mkdir -p /srv/ftp/pub
    mkdir -p /srv/ftp/upload
    mkdir -p /srv/ftp/incoming
    # vsftpd refuses to start if the anonymous chroot root is world-writable,
    # even with allow_writeable_chroot=YES (that option only covers local users).
    # Root must be 755; subdirectories can be 777 (still vulnerable).
    chmod 755 /srv/ftp
    chmod -R 777 /srv/ftp/pub
    chmod -R 777 /srv/ftp/upload
    chmod -R 777 /srv/ftp/incoming
    chown -R ftp:ftp /srv/ftp
    # vsftpd refuses anonymous logins when the chroot root itself is writable by
    # the ftp user, so the root stays root-owned; the 777 subdirectories keep the
    # anonymous-upload vulnerability.
    chown root:root /srv/ftp
    # Create sample files
    echo "Public FTP files - CCDC Practice Range" > /srv/ftp/pub/readme.txt
    echo "Upload directory - anonymous uploads allowed" > /srv/ftp/upload/readme.txt
    # VULN: Credentials left in an accessible file
    echo "Backup credentials - admin:admin, root:ZooTime!, ftpuser:ftpuser" > /srv/ftp/pub/backup_notes.txt
  become: true

# VULN: Create weak local accounts
- name: "VULN - Create weak local accounts"
  ansible.builtin.shell: |
    useradd -m -s /bin/bash ftpuser && echo 'ftpuser:ftpuser' | chpasswd
    useradd -m -s /bin/bash admin && echo 'admin:admin' | chpasswd
    echo 'root:ZooTime!' | chpasswd
  become: true
  ignore_errors: true

# Create realistic employee FTP accounts (weak shared password, like the domain users).
# The scoring engine rotates its FTP login check through all five, one per round.
- name: "Create ZooLand Inc. employee FTP accounts"
  ansible.builtin.shell: |
    for u in mlopez rthomas jsmith bwilson mchen; do
      id "$u" >/dev/null 2>&1 || useradd -m -s /bin/bash "$u"
      echo "$u:ZooLand2025!" | chpasswd
      mkdir -p /home/$u/files
      chown -R $u:$u /home/$u
    done
  become: true

# Ensure ftp user is not in vsftpd deny list
- name: "Allow FTP users in PAM config"
  ansible.builtin.shell: |
    # Remove users from deny lists so they can log in via FTP
    sed -i '/^ftpuser$/d'  /etc/ftpusers 2>/dev/null || true
    sed -i '/^admin$/d'    /etc/ftpusers 2>/dev/null || true
    for u in mlopez rthomas jsmith bwilson mchen; do
      sed -i "/^$u\$/d" /etc/ftpusers 2>/dev/null || true
    done
  become: true

# VULN: Disable firewall
- name: "VULN - Disable firewall"
  ansible.builtin.shell: |
    ufw disable || true
    iptables -F || true
    iptables -P INPUT ACCEPT || true
    iptables -P FORWARD ACCEPT || true
    iptables -P OUTPUT ACCEPT || true
  become: true

- name: "Enable and start vsftpd"
  ansible.builtin.systemd:
    name: vsftpd
    state: restarted
    enabled: true
  become: true
